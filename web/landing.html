<head>
<meta charset="utf-8">
<!-- Bezpečnost: GitHub Pages neumí hlavičky (_headers platí jen na Netlify), proto CSP i tady -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- Ochrana proti vložení stránky do cizího rámečku (clickjacking) – frame-ancestors v <meta> nefunguje -->
<style id="antiClickjack">html{display:none!important}</style>
<script>if (self === top) { var ac = document.getElementById('antiClickjack'); ac.parentNode.removeChild(ac); } else { top.location = self.location; }</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Jedna šablona pro všechny klienty a akce:
 *   /cez            → přehled akcí klienta
 *   /cez/dukovany   → registrace na konkrétní akci
 * Čisté adresy přesměruje hosting na tento soubor (web/_redirects, web/404.html).
 * Záložní tvar bez přesměrování: landing.html?c=cez&e=dukovany
 * APP_BASE = složka, ve které web běží (na doméně "/"; v podsložce např. "/eventy/"). */
(function () {
  // GitHub Pages projektu běží v podsložce (uzivatel.github.io/nazev-repa/) – pozná se samo
  var p = location.pathname, i = p.lastIndexOf('/landing.html');
  var APP_BASE = /\.github\.io$/.test(location.hostname) && p.split('/')[1] ? '/' + p.split('/')[1] + '/' : '/';
  var root = (i >= 0 || location.protocol === 'file:') ? p.slice(0, p.lastIndexOf('/') + 1) : APP_BASE;
  document.write('<base href="' + root + '">');
  window.LANDING_ROUTE = (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('c')) return { client: q.get('c'), event: q.get('e') || '' };
    var rel = decodeURIComponent(p).slice(root.length).replace(/^\/+|\/+$/g, '').split('/');
    return { client: rel[0] || '', event: rel[1] || '' };
  })();
})();
</script>
<title>Registrace</title>
<meta name="theme-color" content="#1E1F2E">
<meta name="robots" content="noindex">

<link rel="stylesheet" href="styles.css">
<style>
body { background: var(--white); }
.page-state { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 48px var(--pad); }
.page-state h1 { font: 600 34px/1.15 var(--sans); letter-spacing: -.02em; margin: 16px 0 10px; }
.page-state p { color: var(--muted); max-width: 46ch; margin: 0 auto; }


/* ---------- HERO (první verze pro ČEZ) ---------- */
.hero { background: var(--gray); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; min-height: min(640px, 100vh); }
.hero-copy { display: flex; flex-direction: column; justify-content: center; padding: 64px 48px 64px 0; }
.hero h1 { font: 600 clamp(34px, 4.6vw, 62px)/1.02 var(--sans); letter-spacing: -.03em; margin: 22px 0 24px; text-wrap: balance; overflow-wrap: anywhere; }
.client-logo { display: block; width: clamp(200px, 26vw, 300px); height: auto; margin: 0 0 32px; }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero .lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 34ch; margin: 0 0 36px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.by { margin: 40px 0 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.by b { color: var(--dark); }
.hero-art { position: relative; background: var(--dark); margin-right: calc(-1 * var(--pad)); min-height: 360px; }
@media (min-width: 1201px) { .hero-art { margin-right: calc((var(--wrap) - 100vw) / 2 - var(--pad)); } }
.hero-art svg.towers { position: absolute; inset: auto 0 0 0; width: 100%; height: 88%; }
.hero-dates { position: absolute; left: 0; top: 48px; display: grid; gap: 2px; z-index: 1; }
.hero-date {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px; padding: 16px 28px 16px 24px;
  background: var(--white); text-decoration: none; transform: translateX(-24px); transition: transform .25s var(--ease);
}
.hero-date:hover { transform: translateX(-16px); }
.hero-date b { font: 600 34px/1 var(--sans); letter-spacing: -.03em; color: var(--brand); min-width: 3.4ch; }
.hero-date span { font-size: 14px; line-height: 1.35; color: var(--muted); }
.hero-date span strong { display: block; color: var(--dark); font-size: 16px; }
.draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s var(--ease) forwards; }
.draw path:nth-child(2) { animation-delay: .25s; } .draw path:nth-child(3) { animation-delay: .5s; } .draw path:nth-child(4) { animation-delay: .75s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.steam { animation: steam 6s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
.steam.s2 { animation-delay: -2s; } .steam.s3 { animation-delay: -4s; }
@keyframes steam { 0%, 100% { opacity: .35; transform: translateY(0) scale(1); } 50% { opacity: .7; transform: translateY(-10px) scale(1.06); } }
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; }
  .hero-copy { padding: 48px 0 40px; }
  .hero-art { margin: 0 calc(-1 * var(--pad)); min-height: 320px; }
  .hero-dates { top: 24px; }
  .hero-date { transform: none; } .hero-date:hover { transform: translateX(6px); }
}

/* ---------- O AKCI (karta s datem) ---------- */
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 40px; margin-bottom: 40px; }
.sec-head p { color: var(--muted); max-width: 44ch; margin: 0; font-size: 17px; }
.ev-card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--white); border: 1px solid var(--gray-2); transition: border-color .2s, box-shadow .25s var(--ease); }
.ev-card:hover { border-color: var(--line); box-shadow: 0 24px 48px -28px rgba(30,31,46,.35); }
.ev-card .ev-main { padding: 32px; border-right: 1px solid var(--gray-2); display: grid; align-content: space-between; gap: 28px; }
.ev-card .ev-top { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 0; }
.ev-card .ev-site { font: 600 13px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ev-card .ev-site b { display: block; color: var(--dark); font-size: 15px; letter-spacing: .1em; margin-top: 4px; }
.ev-left { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 7px 10px; white-space: nowrap; }
.ev-card .ev-date { display: flex; align-items: baseline; gap: 18px; margin: 0; }
.ev-card .ev-date b { font: 600 clamp(64px, 8vw, 104px)/.85 var(--sans); letter-spacing: -.05em; }
.ev-card .ev-date span { font-size: 17px; color: var(--muted); line-height: 1.35; }
.ev-card .ev-date span strong { display: block; color: var(--dark); font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.ev-side { padding: 32px; display: grid; align-content: space-between; gap: 24px; }
.ev-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--gray-2); border: 1px solid var(--gray-2); }
.ev-meta div { background: var(--white); padding: 14px 16px; font-size: 15px; font-weight: 500; }
.ev-meta small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 4px; }
.ev-meta .tbd { color: var(--muted); }
@media (max-width: 820px) { .ev-card { grid-template-columns: 1fr; } .ev-card .ev-main { border-right: 0; border-bottom: 1px solid var(--gray-2); } }
@media (max-width: 520px) { .ev-card .ev-main, .ev-side { padding: 24px 20px; } }


/* ---------- přehled akcí klienta ---------- */
.sec { padding: clamp(56px, 8vw, 112px) 0; }
.sec h2 { font: 600 clamp(30px, 4vw, 48px)/1.05 var(--sans); letter-spacing: -.03em; margin: 16px 0 0; }
.sec.reg { scroll-margin-top: 0; }
.client-hero { background: var(--gray); padding: clamp(56px, 8vw, 104px) 0 clamp(40px, 6vw, 72px); }
.client-hero h1 { font: 600 clamp(38px, 5.4vw, 72px)/1.02 var(--sans); letter-spacing: -.035em; margin: 20px 0 0; max-width: 18ch; }
.client-hero p { color: var(--muted); font-size: 18px; margin: 20px 0 0; max-width: 48ch; }
.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.ev { position: relative; display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--gray-2); text-decoration: none; transition: border-color .2s, box-shadow .25s var(--ease), transform .25s var(--ease); }
.ev:hover { border-color: var(--line); box-shadow: 0 28px 56px -32px rgba(21,24,39,.45); transform: translateY(-2px); }
.ev::before { content: ""; height: 6px; background: var(--brand); }
.ev-body { padding: 28px 32px 0; }
.ev-aud { font: 600 13px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ev h3 { font: 600 26px/1.15 var(--sans); letter-spacing: -.02em; margin: 10px 0 0; }
.ev-date { display: flex; align-items: baseline; gap: 16px; margin: 28px 0 0; }
.ev-date b { font: 600 clamp(56px, 7vw, 88px)/.85 var(--sans); letter-spacing: -.05em; }
.ev-date span { font-size: 16px; color: var(--muted); line-height: 1.35; }
.ev-date span strong { display: block; color: var(--dark); font-size: 20px; font-weight: 600; }
.ev-foot { margin-top: auto; padding: 28px 32px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.ev-foot .tag { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 7px 10px; }
.ev-foot .go { display: inline-flex; align-items: center; gap: 10px; font: 600 14px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dark); }
.ev-foot .go svg { width: 18px; height: 18px; color: var(--brand); transition: transform .25s var(--ease); }
.ev:hover .go svg { transform: translateX(4px); }
@media (max-width: 520px) { .ev-body { padding: 24px 20px 0; } .ev-foot { padding: 24px 20px; } .events { grid-template-columns: 1fr; } }

/* ---------- registrace ---------- */
.reg { background: var(--gray); }
.reg-grid { display: grid; grid-template-columns: 340px 1fr; gap: 56px; align-items: start; }
.reg-aside { position: sticky; top: 112px; }
.reg-aside p { color: var(--muted); font-size: 17px; }
.form { background: var(--white); padding: clamp(24px, 4vw, 48px); display: grid; gap: 28px; border-top: 4px solid var(--brand); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.fs { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; }
.fs legend { padding: 0; margin-bottom: 12px; }
.ev-lock { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; background: var(--brand-soft); border-left: 3px solid var(--brand); }
.ev-lock b { display: block; font-size: 17px; }
.ev-lock span { color: var(--muted); font-size: 14px; }
.guest-box { display: grid; gap: 16px; padding: 20px; background: var(--gray); }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; padding-top: 8px; border-top: 1px solid var(--gray-2); }
.form-foot .check { max-width: 46ch; padding-top: 20px; }
.form-foot .btn { margin-top: 20px; }
.form-err { background: var(--err-soft); color: var(--err); padding: 14px 16px; font-weight: 500; font-size: 15px; border-left: 3px solid var(--err); }
.closed { background: var(--white); padding: clamp(28px, 5vw, 56px); border-top: 4px solid var(--muted-2); }
.closed h3 { font: 600 28px/1.15 var(--sans); margin: 0 0 8px; }
.closed p { color: var(--muted); margin: 0; }

/* potvrzení + náhled vstupenky */
.done { background: var(--white); display: grid; grid-template-columns: 1fr 300px; border-top: 4px solid var(--ok); }
.done-main { padding: clamp(28px, 4vw, 48px); }
.done .ico { width: 52px; height: 52px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; }
.done .ico svg { width: 26px; height: 26px; }
.done h3 { font: 600 clamp(26px, 3.2vw, 36px)/1.1 var(--sans); letter-spacing: -.02em; margin: 22px 0 10px; }
.done p { color: var(--muted); font-size: 17px; margin: 0 0 10px; max-width: 46ch; }
.done .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.done-ticket { background: var(--dark); color: #fff; padding: 28px; display: grid; align-content: start; gap: 14px; }
.done-ticket .k { font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.done-ticket .qr { background: #fff; padding: 12px; }
.done-ticket .qr canvas, .done-ticket .qr img { width: 100% !important; height: auto !important; display: block; }
.done-ticket b { font-size: 18px; }
.done-ticket small { color: rgba(255,255,255,.6); font-size: 13px; }
.sim-note { margin-top: 22px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #FFF8DB; border: 1px dashed #E0B800; font-size: 14px; color: #5B4A00; }
.sim-note b { color: #3D3200; }
@media (max-width: 960px) { .reg-grid { grid-template-columns: 1fr; gap: 28px; } .reg-aside { position: static; } }
@media (max-width: 760px) { .done { grid-template-columns: 1fr; } .done-ticket { grid-template-columns: 120px 1fr; align-items: center; } .done-ticket .k { grid-column: 1 / -1; } }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .form-foot .btn { width: 100%; } }

.privacy { font-size: 14px; color: var(--muted); flex-basis: 100%; order: 3; }
.privacy summary { cursor: pointer; font-weight: 600; color: var(--dark); }
.privacy dl { display: grid; gap: 8px; margin: 12px 0 0; }
.privacy dl div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
.privacy dt { font-weight: 600; color: var(--dark); }
.privacy dd { margin: 0; }
@media (max-width: 520px) { .privacy dl div { grid-template-columns: 1fr; gap: 2px; } }
.hp { position: absolute !important; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body>


<main id="app">
  <div class="page-state" id="loading"><span class="spinner" style="width:34px;height:34px;color:var(--brand)"></span></div>
</main>

<footer class="site-foot" id="foot" hidden>
  <div class="wrap">
    <span id="footText"></span>
  </div>
</footer>

<script src="vendor/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
(() => {
  const { $, $$, esc } = UI;
  const P = window.PLATFORM, F = API.fmt, route = window.LANDING_ROUTE;
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const TBD = '<span class="tbd">Upřesníme</span>';
  let site = null, now = new Date();

  UI.demoBar('Fiktivní data · registrace funguje, e-mail se v demu neodesílá');

  const daysTo = (iso) => Math.ceil((+API.dayDate(iso) - +new Date(now).setHours(0, 0, 0, 0)) / 864e5);
  const plural = (n, a, b, c) => n === 1 ? a : n > 1 && n < 5 ? b : c;
  const isPast = (ev) => daysTo(ev.date) < 0;
  const dlNote = (ev) => ev.registration.deadlineText ? `<div class="notice" role="note"><b>Registrace a změny v registraci jsou možné pouze do ${esc(ev.registration.deadlineText)}.</b>Prosíme, zvažte svou účast a potvrďte ji, nebo zrušte co nejdříve.</div>` : '';
  const regOpen = (ev) => !isPast(ev) && (!ev.registration.deadline || now <= new Date(ev.registration.deadline));

  async function init() {
    if (!route.client) return notFound('Chybí adresa klienta. Použijte prosím odkaz z pozvánky.');
    try {
      site = await API.call('site', { client: route.client, event: route.event });
    } catch (e) { return notFound(e.message); }
    now = new Date(site.now);
    const c = site.client;
    UI.applyBrand(c);
    $('#footText').innerHTML = `Akci pořádá <b style="color:#fff">${esc(P.AGENCY)}</b>${c.contact ? ` · Dotazy: <a href="mailto:${esc(c.contact)}">${esc(c.contact)}</a>` : ''}`;
    $('#foot').hidden = false;
    if (site.event) renderEvent(site.event); else renderClient();
    const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 }) : null;
    $$('.reveal').forEach((el) => io ? io.observe(el) : el.classList.add('in'));
  }

  function notFound(msg) {
    document.title = 'Stránka nenalezena';
    $('#app').innerHTML = `<div class="page-state"><div><span class="label">Registrace</span><h1>Tuhle stránku jsme nenašli</h1><p>${esc(msg)}</p></div></div>`;
  }

  // ============ /klient – přehled akcí ============
  function renderClient() {
    const c = site.client;
    document.title = c.name + ' · Akce pro zaměstnance';
    $('#app').innerHTML = `
      <section class="client-hero">
        <div class="wrap">
          <span class="label">${esc(c.name)}</span>
          <h1>Akce pro zaměstnance</h1>
          <p>${site.events.length > 1 ? 'Vyberte akci podle lokality, kde pracujete.' : ''}</p>
        </div>
      </section>
      <section class="sec">
        <div class="wrap">
          <div class="events">${site.events.map(eventCard).join('') || '<p>Momentálně tu nejsou žádné akce.</p>'}</div>
        </div>
      </section>`;
  }
  function eventCard(ev) {
    const d = daysTo(ev.date);
    const tag = isPast(ev) ? 'Proběhlo' : !regOpen(ev) ? 'Registrace uzavřena' : 'Registrace otevřena';
    return `
      <a class="ev reveal" href="${esc(API.urls.event(site.client, ev))}">
        <div class="ev-body">
          <div class="ev-aud">${esc(ev.audience || '')}</div>
          <h3>${esc(ev.name)}</h3>
          <div class="ev-date"><b>${F.day(ev.date)}</b><span><strong>${esc(ev.city || '')}</strong>${F.long(ev.date)}</span></div>
        </div>
        <div class="ev-foot"><span class="tag">${tag}${d > 0 ? ' · za ' + d + ' ' + plural(d, 'den', 'dny', 'dní') : ''}</span><span class="go">Registrace ${ARROW}</span></div>
      </a>`;
  }

  // ============ /klient/akce – registrace ============
  function renderEvent(ev) {
    const c = site.client, r = ev.registration;
    const d = daysTo(ev.date);
    document.title = ev.name + ' · Registrace';
    if (site.events.length > 1) {
    }

    const nm = String(ev.name), ci = nm.lastIndexOf(',');
    const title = ci > 0 ? esc(nm.slice(0, ci)) + ' <em>' + esc(nm.slice(ci + 1).trim()) + '</em>' : esc(nm);
    const logo = (P.CLIENT_LOGOS || {})[c.slug];
    const year = API.dayDate(ev.date).getFullYear();
    $('#app').innerHTML = `
      <section class="hero">
        <div class="wrap">
          <div class="hero-copy">
            ${logo ? `<img class="client-logo" src="${esc(logo)}" alt="${esc(c.name)}" width="900" height="177">` : ''}
            <span class="label">Pozvánka pro zaměstnance</span>
            <h1>${title}</h1>
            <p class="lead">Děkujeme za celý rok práce. Přijďte ho s&nbsp;námi uzavřít a&nbsp;oslavit.</p>
            <div class="hero-cta">
              ${regOpen(ev) ? `<a class="btn btn-primary" href="#registrace">Registrovat se ${ARROW}</a>` : ''}
              <a class="btn btn-outline" href="#akce">Informace o akci</a>
            </div>
            <p class="by">Pořádá <b>${esc(P.AGENCY)}</b></p>
          </div>
          <div class="hero-art" aria-hidden="true">
            <div class="hero-dates">
              <a class="hero-date" href="#registrace" tabindex="-1"><b>${F.day(ev.date)}</b><span><strong>${esc(ev.city || '')}</strong>${esc(F.weekday(ev.date))} · ${year}</span></a>
            </div>
            <svg class="towers" viewBox="0 0 600 420" preserveAspectRatio="xMidYMax slice" fill="none">
              <g opacity=".9">
                <ellipse class="steam" cx="200" cy="96" rx="58" ry="30" fill="#fff" opacity=".35"/>
                <ellipse class="steam s2" cx="236" cy="70" rx="44" ry="24" fill="#fff" opacity=".25"/>
                <ellipse class="steam s3" cx="408" cy="150" rx="46" ry="24" fill="#fff" opacity=".3"/>
              </g>
              <g class="draw" style="stroke:var(--brand)" stroke-width="2.5" stroke-linecap="round">
                <path pathLength="1" d="M128 420 C 160 300, 168 200, 150 130 L 250 130 C 232 200, 240 300, 272 420"/>
                <path pathLength="1" d="M346 420 C 372 330, 378 250, 364 196 L 448 196 C 434 250, 440 330, 466 420"/>
                <path pathLength="1" d="M150 130 C 175 142, 225 142, 250 130 M364 196 C 384 206, 428 206, 448 196"/>
                <path pathLength="1" d="M0 420 L 600 420"/>
              </g>
              <g stroke="rgba(255,255,255,.14)" stroke-width="1">
                <path d="M156 200 C 185 212, 215 212, 244 200 M146 280 C 180 296, 220 296, 254 280 M140 360 C 178 378, 222 378, 260 360"/>
                <path d="M368 262 C 392 272, 420 272, 444 262 M360 330 C 388 342, 424 342, 452 330"/>
              </g>
              <circle cx="520" cy="92" r="22" style="fill:var(--brand)"/>
            </svg>
          </div>
        </div>
      </section>

      <section class="sec" id="akce">
        <div class="wrap">
          <div class="sec-head reveal">
            <div><span class="label">O akci</span><h2>Kdy a kde</h2></div>
            <p>${esc(ev.audience || '')}</p>
          </div>
          <article class="ev-card reveal">
            <div class="ev-main">
              <div class="ev-top">
                <div class="ev-site">Lokalita<b>${esc(ev.name.split(',').pop().trim())}</b></div>
                ${d > 0 ? `<span class="ev-left">za ${d} ${plural(d, 'den', 'dny', 'dní')}</span>` : ''}
              </div>
              <div class="ev-date"><b>${F.day(ev.date)}</b><span><strong>${esc(ev.city || '')}</strong>${F.long(ev.date)}</span></div>
            </div>
            <div class="ev-side">
              <div class="ev-meta">
                <div><small>Datum</small>${F.date(ev.date)}</div>
                <div><small>Lokalita</small>${ev.city ? esc(ev.city) : TBD}</div>
                <div><small>Místo konání</small>${ev.venue ? esc(ev.venue) : TBD}</div>
                <div><small>Čas</small>${ev.time ? esc(ev.time) : TBD}</div>
              </div>
              ${regOpen(ev) ? `<a class="btn btn-primary btn-block" href="#registrace">Registrovat se ${ARROW}</a>` : ''}
            </div>
          </article>
        </div>
      </section>

      <section class="sec reg" id="registrace">
        <div class="wrap reg-grid">
          <aside class="reg-aside reveal">
            <span class="label">Registrace</span>
            <h2>Registrujte se</h2>
            <p>${esc(ev.name)}, ${F.date(ev.date)}</p>
            ${ev.registration.deadlineText ? `<p><b>Uzávěrka registrací a změn: ${esc(ev.registration.deadlineText)}</b></p>` : ''}
          </aside>
          <div id="regBox"></div>
        </div>
      </section>`;

    if (!regOpen(ev)) {
      $('#regBox').innerHTML = `<div class="closed"><h3>${isPast(ev) ? 'Akce už proběhla' : 'Registrace je uzavřená' + (ev.registration.deadlineText ? ' (uzávěrka ' + esc(ev.registration.deadlineText) + ')' : '')}</h3><p>${c.contact ? 'Dotazy: ' + esc(c.contact) : 'S dotazy se obraťte na organizátora.'}</p></div>`;
      return;
    }
    const doms = r.emailDomains || [];
    const chips = (name, list, type = 'radio', checkFirst = true) => list.map((x, i) => `<label class="chip"><input type="${type}" name="${name}" value="${esc(x)}" ${checkFirst && i === 0 ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('');
    const routes = r.busOption && (r.busRoutes || []).length ? r.busRoutes : [];
    $('#regBox').innerHTML = `
      <form class="form" id="regForm" novalidate>
        ${dlNote(ev)}
        <div class="ev-lock"><div><b>${esc(ev.name)}</b><span>${F.long(ev.date)} · ${esc(ev.city || '')}</span></div></div>
        <div class="form-row">
          <label class="field"><span class="f-label">Jméno a příjmení</span>
            <input class="input" name="name" autocomplete="name" placeholder="Jan Novák" maxlength="80" required></label>
          <label class="field"><span class="f-label">${doms.length ? 'Firemní e-mail' : 'E-mail'}</span>
            <input class="input" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="${doms.length ? 'jmeno.prijmeni@' + esc(doms[0]) : 'jmeno.prijmeni@firma.cz'}" maxlength="120" required></label>
        </div>
        ${r.employeeNo ? `<label class="field"><span class="f-label">Osobní číslo zaměstnance <small>(4 číslice)</small></span>
          <input class="input" name="empNo" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="1234" required style="max-width:180px"></label>` : ''}
        <fieldset class="fs"><legend class="f-label">Strava <small>(můžete zvolit více možností)</small></legend><div class="chips">${chips('diet', r.diets, 'checkbox')}</div></fieldset>
        <label class="field"><span class="f-label">Alergie nebo intolerance <small>(nepovinné)</small></span>
          <input class="input" name="allergies" placeholder="Např. ořechy, celer" maxlength="200"></label>
        <label class="check" id="healthRow" hidden><input type="checkbox" name="healthConsent"><span>Souhlasím se zpracováním údaje o alergii (zdravotní údaj) výhradně pro přípravu jídla na této akci. Bez souhlasu alergii prosím nevyplňujte.</span></label>
        ${(r.transport || []).length ? `<fieldset class="fs"><legend class="f-label">Doprava na akci</legend><div class="chips">${chips('transport', r.transport)}</div>${(r.busInfo || {}).to ? `<small class="bus-info">🚌 ${esc(r.busInfo.to)}</small>` : ''}
          ${routes.length ? `<div class="bus-routes" id="busRoutes" hidden><span class="f-label">Směr svozového autobusu</span><div class="chips">${chips('busRoute', routes, 'radio', false)}</div></div>` : ''}</fieldset>` : ''}
        ${(r.transportBack || []).length ? `<fieldset class="fs"><legend class="f-label">Doprava z akce</legend><div class="chips">${chips('transportBack', r.transportBack)}</div>${(r.busInfo || {}).back ? `<small class="bus-info">🚌 ${esc(r.busInfo.back)}</small>` : ''}</fieldset>` : ''}
        <div class="hp" aria-hidden="true"><label>Nevyplňujte<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="form-err" id="formErr" role="alert" hidden></div>
        <div class="form-foot">
          <label class="check"><input type="checkbox" name="consent"><span>Souhlasím se zpracováním osobních údajů pro organizaci akce podle informací níže.</span></label>
          ${privacyHtml(ev)}
          <button class="btn btn-primary" id="submitBtn" type="submit">Odeslat registraci ${ARROW}</button>
        </div>
      </form>
      <div id="done" tabindex="-1" hidden></div>`;
    bindForm(ev);
  }

  /** Informace o zpracování osobních údajů (GDPR) – hodnoty z CONFIG.PRIVACY v Code.gs. */
  function privacyHtml(ev) {
    const pv = (site && site.privacy) || {};
    const days = pv.retentionDays || 10;
    const row = (k, v) => v ? `<div><dt>${k}</dt><dd>${v}</dd></div>` : '';
    return `<details class="privacy"><summary>Jak s údaji nakládáme</summary><dl>
      ${row('Správce', esc(pv.controller))}
      ${row('Zpracovatel', esc(pv.processor || P.AGENCY))}
      ${row('Účel', 'Registrace na akci ' + esc(ev.name) + ', zaslání vstupenky a připomínek, příprava jídla a dopravy, odbavení u vstupu.')}
      ${row('Jaké údaje', 'Jméno, e-mail, osobní číslo, strava, doprava, čas příchodu. Alergie jen s vaším výslovným souhlasem (zdravotní údaj).')}
      ${row('Uložení', 'V Google tabulce pořadatele, přístup mají jen organizátoři. Údaje nikomu dalšímu nepředáváme.')}
      ${row('Jak dlouho', 'Do ' + days + ' ' + (days === 1 ? 'dne' : 'dnů') + ' po akci údaje smažeme.')}
      ${row('Vaše práva', 'Přístup, oprava, výmaz a odvolání souhlasu' + (pv.contact ? ': napište na <a href="mailto:' + esc(pv.contact) + '">' + esc(pv.contact) + '</a>' : ' – kontaktujte pořadatele akce') + '. Účast můžete kdykoliv zrušit přes odkaz v e-mailu.')}
    </dl></details>`;
  }

  function bindForm(ev) {
    const form = $('#regForm'), r = ev.registration, doms = r.emailDomains || [];
    const gc = $('#guestChips');
    function drawGuests() {
      const n = +(($('input[name=guests]:checked', form) || {}).value || 0);
      const box = $('#guestRows');
      const keep = $$('.g', box).map((g) => [$('input', g).value, $('select', g).value]);
      box.hidden = !n;
      box.innerHTML = Array.from({ length: n }, (_, i) => `
        <div class="g form-row">
          <label class="field"><span class="f-label">Jméno doprovodu <small>(nepovinné)</small></span><input class="input" maxlength="80" value="${esc((keep[i] || [])[0] || '')}"></label>
          <label class="field"><span class="f-label">Strava doprovodu</span><select class="select">${r.diets.map((x) => `<option ${((keep[i] || [])[1] === x) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        </div>`).join('');
    }
    if (gc) gc.addEventListener('change', drawGuests);
    function showErr(msg, field) {
      $('#formErr').textContent = msg; $('#formErr').hidden = false;
      $$('[aria-invalid]', form).forEach((x) => x.removeAttribute('aria-invalid'));
      if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
      else $('#formErr').scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    form.addEventListener('input', (e) => { if (e.target.hasAttribute('aria-invalid')) e.target.removeAttribute('aria-invalid'); });
    const bus = $('#busRoutes');
    const busOn = () => !!bus && (($('input[name=transport]:checked', form) || {}).value === r.busOption);
    if (bus) form.addEventListener('change', (e) => { if (e.target.name === 'transport') bus.hidden = !busOn(); });
    form.elements.allergies.addEventListener('input', () => { $('#healthRow').hidden = !form.elements.allergies.value.trim(); });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#formErr').hidden = true;
      const f = form.elements;
      const name = f.name.value.replace(/\s+/g, ' ').trim();
      const email = f.email.value.trim().toLowerCase();
      if (name.split(' ').length < 2) return showErr('Napište prosím jméno i příjmení.', f.name);
      if (f.empNo && !/^\d{4}$/.test(f.empNo.value.trim())) return showErr('Zadejte prosím čtyřmístné osobní číslo zaměstnance.', f.empNo);
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) return showErr('Zkontrolujte prosím e-mail.', f.email);
      if (doms.length && !doms.some((x) => email.endsWith('@' + x))) return showErr('Použijte prosím firemní e-mail (@' + doms.join(', @') + ').', f.email);
      if (!f.consent.checked) return showErr('Potvrďte prosím souhlas se zpracováním údajů.');
      if (f.allergies.value.trim() && !f.healthConsent.checked) return showErr('U alergie potvrďte prosím souhlas se zpracováním zdravotního údaje, nebo pole nechte prázdné.', f.healthConsent);
      const diets = $$('input[name=diet]:checked', form).map((x) => x.value);
      if (!diets.length) return showErr('Vyberte prosím stravu.', $('input[name=diet]', form));
      const route = ($('input[name=busRoute]:checked', form) || {}).value;
      if (busOn() && !route) return showErr('Vyberte prosím směr svozového autobusu.', $('input[name=busRoute]', form));
      const transport = ($('input[name=transport]:checked', form) || {}).value || '';
      const payload = {
        event: ev.id, name, email, allergies: f.allergies.value.trim(),
        website: f.website.value, consent: f.consent.checked, healthConsent: f.healthConsent.checked,
        diet: diets.join(', '), diets,
        transport: busOn() ? transport + ' – ' + route : transport,
        transportBack: ($('input[name=transportBack]:checked', form) || {}).value || '',
        empNo: f.empNo ? f.empNo.value.trim() : '',
        guests: 0, guestNames: [], guestDiets: [], // doprovod se neregistruje
      };
      const btn = $('#submitBtn'), label = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Odesílám…';
      try {
        const res = await API.call('register', payload);
        success(ev, res, payload);
      } catch (err) { showErr(err.message); }
      finally { btn.disabled = false; btn.innerHTML = label; }
    });
  }

  function success(ev, res, p) {
    const ticketUrl = res.token ? API.urls.ticket(res.token) : '';
    const confirmed = ev.automations.confirm.confirmsAttendance;
    const done = $('#done');
    done.className = 'done';
    done.innerHTML = `
      <div class="done-main">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg></div>
        <h3>Registrace je hotová</h3>
        <p>QR vstupenku posíláme na <b>${esc(p.email)}</b>. Pokud jste už registrovaní, přijde vám znovu.</p>
        <p>${confirmed ? 'Vaše účast je potvrzená.' : 'O potvrzení účasti vás požádáme e-mailem.'}</p>
        <div class="actions">
          ${ticketUrl ? `<a class="btn btn-primary" href="${esc(ticketUrl)}">Zobrazit vstupenku ${ARROW}</a>` : ''}
          <button class="btn btn-outline" type="button" id="again">Registrovat dalšího</button>
        </div>
        ${API.demo ? `<div class="sim-note"><span>🧪</span><span><b>Demo:</b> e-mail se neodesílá. Naostro přijde vstupenka s QR na zadaný e-mail.</span></div>` : ''}
      </div>
      ${ticketUrl ? `<div class="done-ticket"><span class="k">Náhled vstupenky</span><div class="qr" id="doneQr"></div><div><b>${esc(p.name)}</b><br><small>${F.date(ev.date)} · ${esc(ev.city || '')}</small></div></div>` : ''}`;
    if (ticketUrl) API.call('ticket', { token: res.token }).then((t) => UI.qr($('#doneQr'), t.ticket.qrText, { size: 300 })).catch(() => {});
    $('#regForm').hidden = true;
    done.hidden = false; done.focus();
    done.scrollIntoView({ block: 'start', behavior: 'smooth' });
    $('#again').addEventListener('click', () => {
      const form = $('#regForm'); form.reset();
      const box = $('#guestRows'); if (box) { box.innerHTML = ''; box.hidden = true; }
      done.hidden = true; form.hidden = false; form.elements.name.focus();
    });
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || a.getAttribute('href').length < 2) return;
    const sec = document.getElementById(a.getAttribute('href').slice(1));
    if (!sec) return;
    e.preventDefault();
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const first = sec.id === 'registrace' && sec.querySelector('input[name=name]');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 500);
  });

  init();
})();
</script>
</body>
</html>
